name: prisma-migrate-debug
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Show prisma schema head + bytes
        run: |
          echo "---- HEAD (40 lines) ----"
          if [ -f prisma/schema.prisma ]; then
            head -n 40 prisma/schema.prisma
          else
            echo "prisma/schema.prisma not found"
          fi

          echo "---- First 8 bytes (hex) ----"
          if command -v xxd >/dev/null 2>&1; then
            xxd -g 1 -l 8 prisma/schema.prisma
          else
            hexdump -C prisma/schema.prisma | head -n 2
          fi

          echo "---- DATABASE_URL presence ----"
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL: MISSING"
          else
            echo "DATABASE_URL: SET"
          fi

          echo "---- Resolve A/AAAA ----"
          if command -v host >/dev/null 2>&1; then
            host db.gjutrpmsfmkuihkyguxs.supabase.co
          else
            nslookup db.gjutrpmsfmkuihkyguxs.supabase.co
          fi

          echo "---- TCP check (IPv4 + IPv6 attempts) ----"
          if command -v pg_isready >/dev/null 2>&1; then
            pg_isready -h db.gjutrpmsfmkuihkyguxs.supabase.co -p 5432
          else
            echo "pg_isready not available"
          fi

          if command -v nc >/dev/null 2>&1; then
            nc -vz -w 5 db.gjutrpmsfmkuihkyguxs.supabase.co 5432
          else
            echo "nc not available"
          fi

      - name: Install workspace
        run: pnpm install -w

      - name: Run prisma migrate (debug)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm -w dlx prisma migrate deploy --schema=./prisma/schema.prisma